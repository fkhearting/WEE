<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>weibo-extend</title>
<meta name="description" content="weibo-extend">
<!-- 基准路径，保证资源、内容正常读取 -->
<base href="./">
<link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
<script src="./assets/myblog.js"></script>
<link href="./assets/style/weibosave.css" rel="stylesheet" type="text/css">
<script src="./assets/scripts/weibosave.js" defer="defer"></script>
<style>
#imagePopup.active{
    display: flex;
}
#imagePopup{
    display: none;
}
</style>
</head>
<body class="" id="weibo-extend-weibosave">
<div class="bg-gray-100">
<div id="weibo-extend-posts" class="mx-auto my-0 w-[50rem] px-8 flex flex-col gap-6 break-words pb-10"></div>
<div id="imagePopup" class="hidden fixed p-4 inset-0 items-center justify-center bg-black bg-opacity-50 z-[99]">
<img src="" alt="Popup Image" class="max-w-full max-h-full rounded-xl">
</div>
</div>
<div class="border-b border-dashed border-gray-100 overflow-scroll text-gray-500 rounded text-base"></div>

<script>
const popup = document.getElementById('imagePopup');
const popupImg = popup.querySelector('img');

document.addEventListener('click',function(e){
    if(e.target.tagName === 'IMG' && !popup.contains(e.target)){
        popupImg.src = e.target.src;
        popup.classList.add('active');
    }
});
popup.addEventListener('click',function(e){
    if(e.target === popup){
        popup.classList.remove('active');
        popupImg.src = '';
    }
});
</script>
</body>
</html>
